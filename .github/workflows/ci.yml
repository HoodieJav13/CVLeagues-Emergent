# CVF Leagues continuous integration.
#
# Mirrors the "Required verification" list in AGENTS.md so every pull request
# and every push to main proves the same four things the owner used to run by
# hand: the complete database harness, the frontend Jest suite, the production
# build (whose prebuild step enforces the no-mock-fallback rule), and the API
# unit tests. Nothing here touches the hosted Supabase project, Vercel, or any
# secret: the only environment values are public placeholders that satisfy the
# production-env preflight without pointing at a real backend.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pgtest:
    name: Database harness (pgtest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # run_pgtest.sh needs only initdb, pg_ctl, createdb, and psql. The Debian
      # packages keep those under /usr/lib/postgresql/16/bin, off the default
      # PATH, so the second step prepends it for the rest of the job.
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16

      - name: Put PostgreSQL 16 binaries on PATH
        run: echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          initdb --version
          pg_ctl --version
          psql --version

      - name: Run the complete database harness
        run: ./tests/pgtest/run_pgtest.sh

  frontend:
    name: Frontend tests + production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # Public placeholders only. scripts/validate-production-env.cjs requires
      # these three names to be non-empty; it never reads their values, and a
      # CI build is never deployed. The Turnstile value is Cloudflare's
      # documented always-passes test site key. No real key belongs here.
      REACT_APP_SUPABASE_URL: https://ci-placeholder.supabase.co
      REACT_APP_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      REACT_APP_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --legacy-peer-deps: react-day-picker 8.10.1 declares a peer range of
      # date-fns ^2 || ^3 while the app pins date-fns 4.1.0. The committed
      # lockfile already resolves that tree; strict peer checking would reject
      # it and refuse to install anything.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Frontend test suite
        run: CI=true npm test -- --watchAll=false

      - name: Production build (prebuild env preflight included)
        run: npm run build

  api:
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: API tests (node --test)
        run: npm run test:api

  smoke:
    name: Production-build smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same public placeholders as the frontend job; every request the bundle
      # makes to this host is answered by the test from the seed fixtures.
      REACT_APP_SUPABASE_URL: https://ci-placeholder.supabase.co
      REACT_APP_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      REACT_APP_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e-smoke/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Install smoke dependencies
        working-directory: tests/e2e-smoke
        run: npm ci

      - name: Install Chromium
        working-directory: tests/e2e-smoke
        run: npx playwright install --with-deps chromium

      - name: Run the smoke against frontend/build
        working-directory: tests/e2e-smoke
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-traces
          path: tests/e2e-smoke/test-results
          if-no-files-found: ignore
